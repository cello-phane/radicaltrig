<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="100%" height="100%">
  <defs>
    <!-- Line Glow Filter (adapted for light theme, softer) -->
    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Point Glow (for definition against white) -->
    <filter id="lightPointGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .axis-light { stroke: #495057; stroke-width: 2.5; stroke-linecap: round; }
    .unit-circle-light { fill: none; stroke: #ADB5BD; stroke-width: 3; stroke-dasharray: 8 8; }
    .diagonal-line-light { stroke: #CED4DA; stroke-width: 2; stroke-dasharray: 5 5; }

    /* Colors derived from original theme, made richer and more solid for light bg */
    .linear-ray-light { stroke: #2E5A88; stroke-width: 2.5; opacity: 0.9; }
    .warped-ray-light { stroke: #705EB1; stroke-width: 3; } /* Slightly deeper purple */

    .proj-line-light { stroke: #C89B3D; stroke-width: 2.5; stroke-dasharray: 4 4; } /* Richer gold */
    .radial-proj-light { stroke: #3A9E91; stroke-width: 2.5; stroke-dasharray: 5 5; } /* Deeper teal */

    .node-orig-light { fill: #FFFFFF; stroke: #495057; stroke-width: 3.5; }
    .node-t-light { fill: #2E5A88; stroke: #FFFFFF; stroke-width: 1.5; filter: url(#lightPointGlow); }
    .node-w-light { fill: #705EB1; stroke: #FFFFFF; stroke-width: 1.5; filter: url(#lightPointGlow); }
    .node-circle-light { fill: #3A9E91; stroke: #FFFFFF; stroke-width: 1.5; filter: url(#lightPointGlow); }

    .label-axis-light { fill: #212529; font-family: 'SF Pro Display', -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
    .label-point-light { font-family: 'SF Pro Display', -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
  </style>

  <!-- Background (Pure White) -->
  <rect width="600" height="520" rx="16" fill="#FFFFFF"/>

  <!-- Geometry Setup Parameters (Identical to original):
       Origin (cx, cy) = (80, 420)
       Radius R = 320
       t = 0.62 -> linear point: (1-t, t) = (0.38, 0.62)
       w = warp(0.62) ≈ 0.685 -> warped point: (1-w, w) = (0.315, 0.685)
       D = (1-w)^2 + w^2 ≈ 0.568 -> r = 1/sqrt(D) ≈ 1.326
       Unit circle point: r*(1-w, w) = (0.418, 0.908)
  -->

  <g id="main-diagram" transform="scale(0.5)">
    <!-- Axes -->
    <line x1="80" y1="420" x2="440" y2="420" class="axis-light" />
    <line x1="80" y1="420" x2="80" y2="60" class="axis-light" />

    <!-- Unit Circle Arc (Radius 320) -->
    <path d="M 400 420 A 320 320 0 0 0 80 100" class="unit-circle-light" />

    <!-- Unit Diagonal Segment (1-x, x) from (1,0) to (0,1) -->
    <line x1="400" y1="420" x2="80" y2="100" class="diagonal-line-light" />

    <!-- Linear Ray through (1-t, t) -->
    <line x1="80" y1="420" x2="201.6" y2="221.6" class="linear-ray-light" />

    <!-- Warped Ray through (1-w, w) and projected to Unit Circle -->
    <line x1="80" y1="420" x2="213.76" y2="129.44" class="warped-ray-light" filter="url(#lightGlow)" />

    <!-- Warp Transformation Arrow / Line: (1-t, t) -> (1-w, w) -->
    <line x1="201.6" y1="221.6" x2="180.8" y2="200.8" class="proj-line-light" />

    <!-- Radial Projection Line to Unit Circle Arc: (1-w, w) -> (cos, sin) -->
    <line x1="180.8" y1="200.8" x2="213.76" y2="129.44" class="radial-proj-light" />

    <!-- Coordinate Drop Lines (Dashed, solid colored) -->
    <line x1="180.8" y1="200.8" x2="180.8" y2="420" stroke="#705EB1" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.6" />
    <line x1="180.8" y1="200.8" x2="80" y2="200.8" stroke="#705EB1" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.6" />

    <line x1="201.6" y1="221.6" x2="201.6" y2="420" stroke="#2E5A88" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.6" />
    <line x1="201.6" y1="221.6" x2="80" y2="221.6" stroke="#2E5A88" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.6" />

    <!-- Nodes / Points -->
    <!-- Origin Point -->
    <circle cx="80" cy="420" r="6" class="node-orig-light" />

    <!-- Linear Point (1-t, t) -->
    <circle cx="201.6" cy="221.6" r="5" class="node-t-light" />

    <!-- Warped Diagonal Point (1-w, w) -->
    <circle cx="180.8" cy="200.8" r="5.5" class="node-w-light" />

    <!-- Final Unit Circle Projection Point -->
    <circle cx="213.76" cy="129.44" r="6" class="node-circle-light" />

    <!-- Axis Labels (Higher Contrast) -->
    <text x="75" y="448" class="label-axis-light" text-anchor="middle">0</text>
    <text x="400" y="448" class="label-axis-light" text-anchor="middle">1</text>
    <text x="52" y="105" class="label-axis-light" text-anchor="end">1</text>

    <!-- Point Labels -->
    <text x="214" y="235" class="label-point-light" fill="#2E5A88">(1-t, t)</text>
    <text x="110" y="195" class="label-point-light" fill="#705EB1">(1-w, w)</text>
    <text x="228" y="125" class="label-point-light" fill="#3A9E91">((1-w)/√D, w/√D)</text>
  </g>
</svg>
