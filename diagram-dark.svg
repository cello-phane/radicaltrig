<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="65%" height="65%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181B26"/>
      <stop offset="100%" stop-color="#0D0E14"/>
    </radialGradient>

    <!-- Line Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Point Glow -->
    <filter id="pointGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .axis { stroke: #3A4158; stroke-width: 2; stroke-linecap: round; }
    .grid-arc { fill: none; stroke: #2E354A; stroke-width: 1.5; }
    .unit-circle { fill: none; stroke: #4A5578; stroke-width: 2.5; stroke-dasharray: 6 6; }
    .diagonal-line { stroke: #6B7A99; stroke-width: 2; stroke-dasharray: 4 4; }

    .linear-ray { stroke: #4682B4; stroke-width: 2; opacity: 0.8; }
    .warped-ray { stroke: #9D8DF1; stroke-width: 2.5; }

    .proj-line { stroke: #F0B848; stroke-width: 2; stroke-dasharray: 3 3; }
    .radial-proj { stroke: #5FD4C4; stroke-width: 2; stroke-dasharray: 4 4; }

    .node-orig { fill: #0D0E14; stroke: #3A4158; stroke-width: 3; }
    .node-t { fill: #4682B4; filter: url(#pointGlow); }
    .node-w { fill: #9D8DF1; filter: url(#pointGlow); }
    .node-circle { fill: #5FD4C4; filter: url(#pointGlow); }

    .label-axis { fill: #7D8BAA; font-family: 'SF Pro Display', -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
    .label-point { font-family: 'SF Pro Display', -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="600" height="520" rx="16" fill="url(#bgGrad)"/>

  <!-- Geometry Setup Parameters:
       Origin (cx, cy) = (80, 420)
       Radius R = 320
       t = 0.62 -> linear point: (1-t, t) = (0.38, 0.62)
       w = warp(0.62) ≈ 0.685 -> warped point: (1-w, w) = (0.315, 0.685)
       D = (1-w)^2 + w^2 ≈ 0.568 -> r = 1/sqrt(D) ≈ 1.326
       Unit circle point: r*(1-w, w) = (0.418, 0.908)
  -->

  <g id="main-diagram">
    <!-- Axes -->
    <line x1="80" y1="420" x2="440" y2="420" class="axis" />
    <line x1="80" y1="420" x2="80" y2="60" class="axis" />

    <!-- Unit Circle Arc (Radius 320) -->
    <path d="M 400 420 A 320 320 0 0 0 80 100" class="unit-circle" />

    <!-- Unit Diagonal Segment (1-x, x) from (1,0) to (0,1) -->
    <line x1="400" y1="420" x2="80" y2="100" class="diagonal-line" />

    <!-- Linear Ray through (1-t, t) -->
    <!-- t = 0.62 => x = 80 + 0.38*320 = 201.6, y = 420 - 0.62*320 = 221.6 -->
    <line x1="80" y1="420" x2="201.6" y2="221.6" class="linear-ray" />

    <!-- Warped Ray through (1-w, w) and projected to Unit Circle -->
    <!-- w = 0.685 => x_w = 80 + 0.315*320 = 180.8, y_w = 420 - 0.685*320 = 200.8 -->
    <!-- Unit Circle Pt: x_c = 80 + 0.418*320 = 213.76, y_c = 420 - 0.908*320 = 129.44 -->
    <line x1="80" y1="420" x2="213.76" y2="129.44" class="warped-ray" filter="url(#glow)" />

    <!-- Warp Transformation Arrow / Line: (1-t, t) -> (1-w, w) -->
    <line x1="201.6" y1="221.6" x2="180.8" y2="200.8" class="proj-line" />

    <!-- Radial Projection Line to Unit Circle Arc: (1-w, w) -> (cos, sin) -->
    <line x1="180.8" y1="200.8" x2="213.76" y2="129.44" class="radial-proj" />

    <!-- Coordinate Drop Lines (Dashed) -->
    <line x1="180.8" y1="200.8" x2="180.8" y2="420" stroke="#9D8DF1" stroke-width="1" stroke-dasharray="2 4" opacity="0.4" />
    <line x1="180.8" y1="200.8" x2="80" y2="200.8" stroke="#9D8DF1" stroke-width="1" stroke-dasharray="2 4" opacity="0.4" />

    <line x1="201.6" y1="221.6" x2="201.6" y2="420" stroke="#4682B4" stroke-width="1" stroke-dasharray="2 4" opacity="0.4" />
    <line x1="201.6" y1="221.6" x2="80" y2="221.6" stroke="#4682B4" stroke-width="1" stroke-dasharray="2 4" opacity="0.4" />

    <!-- Nodes / Points -->
    <!-- Origin Point -->
    <circle cx="80" cy="420" r="5" class="node-orig" />

    <!-- Linear Point (1-t, t) -->
    <circle cx="201.6" cy="221.6" r="4.5" class="node-t" />

    <!-- Warped Diagonal Point (1-w, w) -->
    <circle cx="180.8" cy="200.8" r="5" class="node-w" />

    <!-- Final Unit Circle Projection Point -->
    <circle cx="213.76" cy="129.44" r="5.5" class="node-circle" />

    <!-- Axis Labels -->
    <text x="75" y="445" class="label-axis" text-anchor="middle">0</text>
    <text x="400" y="445" class="label-axis" text-anchor="middle">1</text>
    <text x="55" y="105" class="label-axis" text-anchor="end">1</text>

    <!-- Point Labels -->
    <text x="214" y="232" class="label-point" fill="#4682B4">(1-t, t)</text>
    <text x="110" y="195" class="label-point" fill="#9D8DF1">(1-w, w)</text>
    <text x="228" y="125" class="label-point" fill="#5FD4C4">((1-w)/√D, w/√D)</text>
  </g>
</svg>
